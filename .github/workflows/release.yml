name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          cache: true

      - name: Configure
        run: cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DTODOAPP_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-release

      - name: Package
        run: macdeployqt build-release/ToDoApp.app -dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoApp-dmg
          path: build-release/ToDoApp.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-release/ToDoApp.dmg